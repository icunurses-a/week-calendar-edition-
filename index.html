<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام الأكاديمي - قابل للتخصيص</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- المتغيرات الديناميكية للتخصيص --- */
        :root {
            /* الألوان الأساسية (يمكن تعديلها) */
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-settings: rgba(30, 41, 59, 0.95);
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            
            /* التكبير والخطوط */
            --font-family: 'Tajawal', sans-serif;
            --base-font-size: 16px; 
            --zoom-scale: 1.0;
            
            /* ألوان المواد */
            --color-nur409: #fb923c; 
            --color-nur406: #f472b6; 
            --color-qr: #facc15;     
            --color-phd: #38bdf8;    
            --color-nur2201: #34d399;
            --color-nur407: #a78bfa; 
            --color-icc: #ef4444;    
            
            /* التصميم */
            --radius: 15px;
            --glass-effect: blur(10px);
            --holiday-bg: #450a0a;
            --holiday-text: #fca5a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        
        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-size: var(--base-font-size);
            padding: 20px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* --- حاوية المحتوى الرئيسية (يتم تطبيق التكبير عليها) --- */
        .zoom-wrapper {
            transform: scale(var(--zoom-scale));
            transform-origin: top center;
            transition: transform 0.2s ease-out;
            padding-bottom: 50px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-weight: 900;
            font-size: 2.2rem;
        }

        .section-title {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 50px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: inline-block;
            padding-bottom: 10px;
        }

        /* --- زر الإعدادات العائم --- */
        .settings-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            background: var(--accent-color, #38bdf8);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            font-size: 24px;
            border: none;
            transition: transform 0.3s;
        }
        .settings-btn:hover { transform: rotate(90deg); }

        /* --- لوحة الإعدادات (Sidebar) --- */
        .settings-panel {
            position: fixed;
            top: 0;
            left: -320px; /* مخفية */
            width: 300px;
            height: 100vh;
            background: var(--bg-settings);
            backdrop-filter: var(--glass-effect);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            z-index: 1001;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .settings-panel.active { left: 0; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }

        .setting-group { margin-bottom: 25px; }
        .setting-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* أدوات التحكم */
        input[type="range"] { width: 100%; cursor: pointer; }
        input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 5px; cursor: pointer; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); font-family: var(--font-family); }
        
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .theme-btn {
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .theme-btn.selected { border-color: var(--text-primary); }

        .btn-reset {
            width: 100%;
            padding: 12px;
            background: var(--accent-color, #ef4444);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        /* --- الجدول الأسبوعي --- */
        .schedule-wrapper {
            overflow-x: auto;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: 80px repeat(5, 1fr); 
            grid-template-rows: 50px repeat(14, minmax(60px, auto)); 
            gap: 1px;
            background-color: var(--border-color);
            width: 100%;
        }

        .cell { background-color: var(--bg-card); position: relative; }

        .header-cell {
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            z-index: 5;
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.05); /* Slightly transparent header */
        }

        .time-cell {
            background-color: rgba(0,0,0,0.2);
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-color);
        }

        .empty-cell { min-height: 60px; }

        .class-card {
            margin: 3px;
            padding: 8px;
            border-radius: 6px;
            border-right: 3px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s;
            height: 100%;
            min-height: 60px;
            font-size: 0.85rem;
        }

        .class-card:hover { transform: scale(1.01); z-index: 2; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .class-name { font-weight: bold; font-size: 0.95rem; margin-bottom: 3px; }
        .class-code { font-size: 0.75rem; opacity: 0.7; font-family: monospace; }
        .class-type { font-size: 0.7rem; margin-top: auto; background: rgba(0,0,0,0.2); padding: 2px 5px; border-radius: 3px; width: fit-content; }
        .class-info { display: none; margin-top: 5px; padding-top: 5px; border-top: 1px dashed rgba(255,255,255,0.1); font-size: 0.75rem; }
        .class-card:hover .class-info { display: block; }

        /* ألوان المواد */
        .bg-nur409 { background: rgba(251, 146, 60, 0.15); color: #fed7aa; border-color: var(--color-nur409); }
        .bg-nur406 { background: rgba(244, 114, 182, 0.15); color: #fbcfe8; border-color: var(--color-nur406); }
        .bg-qr { background: rgba(250, 204, 21, 0.15); color: #fef08a; border-color: var(--color-qr); }
        .bg-phd { background: rgba(56, 189, 248, 0.15); color: #bae6fd; border-color: var(--color-phd); }
        .bg-nur2201 { background: rgba(52, 211, 153, 0.15); color: #a7f3d0; border-color: var(--color-nur2201); }
        .bg-nur407 { background: rgba(167, 139, 250, 0.15); color: #ddd6fe; border-color: var(--color-nur407); }
        .bg-icc { background: rgba(239, 68, 68, 0.15); color: #fecaca; border-color: var(--color-icc); }

        /* --- التقويم --- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .week-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .week-num { font-weight: bold; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 5px; }
        .week-dates { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: var(--text-primary); }
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; display: inline-block; }
        .status-study { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .status-holiday { background: var(--holiday-bg); color: var(--holiday-text); border: 1px solid var(--color-icc); }

    </style>
</head>
<body>

    <!-- زر فتح الإعدادات -->
    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>

    <!-- لوحة الإعدادات -->
    <div class="settings-panel" id="settingsPanel">
        <div class="panel-header">
            <h3>التخصيص</h3>
            <button class="close-btn" onclick="toggleSettings()">✖</button>
        </div>

        <!-- الألوان -->
        <div class="setting-group">
            <label class="setting-label">خلفية الصفحة</label>
            <input type="color" id="bg-body-input" oninput="updateVar('--bg-body', this.value)">
        </div>
        <div class="setting-group">
            <label class="setting-label">لون البطاقات</label>
            <input type="color" id="bg-card-input" oninput="updateVar('--bg-card', this.value)">
        </div>

        <!-- الخطوط -->
        <div class="setting-group">
            <label class="setting-label">نوع الخط</label>
            <select id="font-select" onchange="updateFont(this.value)">
                <option value="'Tajawal', sans-serif">تجوال (افتراضي)</option>
                <option value="'Cairo', sans-serif">القاهرة</option>
                <option value="'Amiri', serif">أميري</option>
                <option value="sans-serif">نظامي (Sans-Serif)</option>
            </select>
        </div>

        <!-- الأحجام والتكبير -->
        <div class="setting-group">
            <label class="setting-label">حجم الخط (<span id="fs-val">16px</span>)</label>
            <input type="range" min="12" max="24" value="16" oninput="updateVar('--base-font-size', this.value + 'px'); document.getElementById('fs-val').innerText = this.value + 'px';">
        </div>

        <div class="setting-group">
            <label class="setting-label">تكبير الشاشة (<span id="zm-val">100%</span>)</label>
            <input type="range" min="0.8" max="1.3" step="0.05" value="1" oninput="updateVar('--zoom-scale', this.value); document.getElementById('zm-val').innerText = Math.round(this.value*100) + '%';">
        </div>

        <!-- الثيمات السريعة -->
        <div class="setting-group">
            <label class="setting-label">نظام الألوان</label>
            <div class="theme-grid">
                <div class="theme-btn" style="background: #0f172a;" onclick="applyTheme('dark')" title="داكن"></div>
                <div class="theme-btn" style="background: #ffffff; border:1px solid #ccc" onclick="applyTheme('light')" title="فاتح"></div>
                <div class="theme-btn" style="background: #2e1065;" onclick="applyTheme('purple')" title="بنفسجي"></div>
                <div class="theme-btn" style="background: #064e3b;" onclick="applyTheme('green')" title="أخضر"></div>
                <div class="theme-btn" style="background: #7f1d1d;" onclick="applyTheme('red')" title="أحمر"></div>
                <div class="theme-btn" style="background: #1e1e1e;" onclick="applyTheme('black')" title="أسود"></div>
            </div>
        </div>

        <button class="btn-reset" onclick="resetSettings()">إعادة ضبط الافتراضي</button>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="zoom-wrapper" id="mainContent">
        <div class="container">
            <h1>الجدول الدراسي الأسبوعي</h1>
            
            <div class="schedule-wrapper">
                <div class="schedule-grid" id="scheduleGrid">
                    <!-- سيتم التوليد تلقائياً -->
                </div>
            </div>

            <div class="section-title">التقويم الأكاديمي (20 أسبوع)</div>
            
            <div class="calendar-grid" id="calendarGrid">
                <!-- سيتم التوليد تلقائياً -->
            </div>
        </div>
    </div>

<script>
    // --- 1. إعدادات وتخصيص (Customization Logic) ---
    const settingsPanel = document.getElementById('settingsPanel');

    function toggleSettings() {
        settingsPanel.classList.toggle('active');
    }

    function updateVar(name, value) {
        document.documentElement.style.setProperty(name, value);
        saveSettings();
    }

    function updateFont(val) {
        document.documentElement.style.setProperty('--font-family', val);
        saveSettings();
    }

    const themes = {
        dark: { bg: '#0f172a', card: '#1e293b', text: '#f8fafc' },
        light: { bg: '#f1f5f9', card: '#ffffff', text: '#0f172a' },
        purple: { bg: '#2e1065', card: '#4c1d95', text: '#e9d5ff' },
        green: { bg: '#064e3b', card: '#065f46', text: '#d1fae5' },
        red: { bg: '#7f1d1d', card: '#991b1b', text: '#fee2e2' },
        black: { bg: '#000000', card: '#1a1a1a', text: '#e5e5e5' }
    };

    function applyTheme(themeName) {
        const t = themes[themeName];
        if(t) {
            updateVar('--bg-body', t.bg);
            updateVar('--bg-card', t.card);
            updateVar('--text-primary', t.text);
            
            // تحديث قيم ألوان الإدخال
            document.getElementById('bg-body-input').value = t.bg;
            document.getElementById('bg-card-input').value = t.card;
        }
    }

    function saveSettings() {
        const settings = {
            bgBody: getComputedStyle(document.documentElement).getPropertyValue('--bg-body').trim(),
            bgCard: getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim(),
            textPrimary: getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim(),
            font: getComputedStyle(document.documentElement).getPropertyValue('--font-family').trim(),
            fontSize: document.querySelector('input[type="range"][oninput*="base-font-size"]').value,
            zoom: document.querySelector('input[type="range"][oninput*="zoom-scale"]').value
        };
        localStorage.setItem('myAcademicSettings', JSON.stringify(settings));
    }

    function loadSettings() {
        const saved = localStorage.getItem('myAcademicSettings');
        if (saved) {
            const s = JSON.parse(saved);
            if(s.bgBody) updateVar('--bg-body', s.bgBody);
            if(s.bgCard) updateVar('--bg-card', s.bgCard);
            if(s.textPrimary) updateVar('--text-primary', s.textPrimary);
            if(s.font) updateFont(s.font);
            if(s.fontSize) {
                updateVar('--base-font-size', s.fontSize + 'px');
                document.querySelector('input[type="range"][oninput*="base-font-size"]').value = s.fontSize;
                document.getElementById('fs-val').innerText = s.fontSize + 'px';
            }
            if(s.zoom) {
                updateVar('--zoom-scale', s.zoom);
                document.querySelector('input[type="range"][oninput*="zoom-scale"]').value = s.zoom;
                document.getElementById('zm-val').innerText = Math.round(s.zoom*100) + '%';
            }
        }
    }

    function resetSettings() {
        localStorage.removeItem('myAcademicSettings');
        location.reload();
    }

    // --- 2. منطق الجدول والتقويم (Schedule & Calendar Logic) ---

    const startHour = 8;
    const endHour = 22;
    const totalHours = endHour - startHour;

    const timeSlots = [];
    for(let i=0; i<totalHours; i++) {
        let hour = startHour + i;
        timeSlots.push(`${hour < 10 ? '0'+hour : hour}:00`);
    }

    const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];

    const courses = [
        {
            name: "تمريض النساء والتوليد",
            code: "NUR3409",
            type: "محاكاة سريرية",
            dayIndex: 0, startSlot: 1, endSlot: 7,
            lecturer: "ضيف الله داخل دخيل الله الثبيتي",
            hall: "36-1.008", colorClass: "bg-nur409"
        },
        {
            name: "تمريض رعاية البالغين 2",
            code: "NUR2406",
            type: "محاكاة سريرية",
            dayIndex: 1, startSlot: 1, endSlot: 7,
            lecturer: "إبراهيم ابكر إبراهيم ابكر",
            hall: "36-1.007", colorClass: "bg-nur406"
        },
        {
            name: "القيم والأخلاق",
            code: "ICC1201",
            type: "نظري",
            dayIndex: 1, startSlot: 9, endSlot: 10, // UPDATED TIME: 16:00-18:00
            lecturer: "غير محدد",
            hall: "عن بعد", colorClass: "bg-icc"
        },
        {
            name: "حفظ القرآن الكريم 1",
            code: "QR2102",
            type: "نظري",
            dayIndex: 1, startSlot: 13, endSlot: 14,
            lecturer: "عصام دخيل الله حامد الحربي",
            hall: "عن بعد", colorClass: "bg-qr"
        },
        {
            name: "تمريض النساء والتوليد",
            code: "NUR3409",
            type: "نظري",
            dayIndex: 2, startSlot: 3, endSlot: 4,
            lecturer: "كامليا جميل سالم بلجون",
            hall: "37-0.016", colorClass: "bg-nur409"
        },
        {
            name: "وظائف أعضاء مرضي و أدوية مدمج",
            code: "PHD2411",
            type: "نظري",
            dayIndex: 2, startSlot: 13, endSlot: 14,
            lecturer: "احمد محمد احمد عاشور",
            hall: "-", colorClass: "bg-phd"
        },
        {
            name: "تمريض رعاية البالغين 2",
            code: "NUR2406",
            type: "نظري",
            dayIndex: 3, startSlot: 1, endSlot: 4,
            lecturer: "بدرية عبدالله محمد الفكى",
            hall: "37-0.016", colorClass: "bg-nur406"
        },
        {
            name: "تثقيف وتعزيز صحة الأنسان",
            code: "NUR2201",
            type: "نظري",
            dayIndex: 3, startSlot: 9, endSlot: 10,
            lecturer: "منى ابراهيم حضيض الحربي",
            hall: "37-0.016", colorClass: "bg-nur2201"
        },
        {
            name: "نمو وتطور الانسان",
            code: "NUR2407",
            type: "نظري",
            dayIndex: 4, startSlot: 3, endSlot: 4,
            lecturer: "دعاء علي يحيى عطوه",
            hall: "37-0.016", colorClass: "bg-nur407"
        }
    ];

    const holidays = [
        { start: 8, end: 10, name: "إجازة رمضان" },
        { start: 18, end: 19, name: "إجازة عيد الأضحى" }
    ];

    const weekDates = {
        1: "18-22 Jan.", 2: "25-29 Jan.", 3: "01-05 Feb.", 4: "08-12 Feb.",
        5: "15-19 Feb.", 6: "22-26 Feb.", 7: "01-05 Mar.", 8: "08-12 Mar.",
        9: "15-19 Mar.", 10: "22-26 Mar.", 11: "29 Mar.-02 Apr.", 12: "05-09 Apr.",
        13: "12-16 Apr.", 14: "19-23 Apr.", 15: "26-30 Apr.", 16: "03-07 May",
        17: "10-14 May", 18: "17-21 May", 19: "24-28 May", 20: "31 May.-04 Jun."
    };

    function buildSchedule() {
        const grid = document.getElementById('scheduleGrid');
        const occupied = new Map();

        const corner = document.createElement('div');
        corner.className = 'cell header-cell';
        corner.innerText = 'الوقت';
        grid.appendChild(corner);

        days.forEach(day => {
            const header = document.createElement('div');
            header.className = 'cell header-cell';
            header.innerText = day;
            grid.appendChild(header);
        });

        for (let r = 2; r <= 15; r++) {
            const slotIndex = r - 1; 
            
            const timeCell = document.createElement('div');
            timeCell.className = 'cell time-cell';
            timeCell.innerText = timeSlots[slotIndex - 1];
            timeCell.style.gridRow = r;
            timeCell.style.gridColumn = 1;
            grid.appendChild(timeCell);

            for (let c = 2; c <= 6; c++) {
                const dayIndex = c - 2; 

                if (occupied.get(`${r},${c}`)) continue;

                const course = courses.find(crs => 
                    crs.dayIndex === dayIndex && 
                    crs.startSlot === slotIndex
                );

                if (course) {
                    const card = document.createElement('div');
                    card.className = `cell class-card ${course.colorClass}`;
                    const span = course.endSlot - course.startSlot + 1;
                    card.style.gridRow = `span ${span}`;
                    card.style.gridColumn = c;

                    for (let i = 0; i < span; i++) {
                        occupied.set(`${r + i},${c}`, true);
                    }

                    card.innerHTML = `
                        <div class="class-name">${course.name}</div>
                        <div class="class-code">${course.code}</div>
                        <div class="class-type">${course.type}</div>
                        <div class="class-info">🧑‍🏫 ${course.lecturer}<br>🏛️ ${course.hall}</div>
                    `;
                    grid.appendChild(card);

                } else {
                    const empty = document.createElement('div');
                    empty.className = 'cell empty-cell';
                    empty.style.gridRow = r;
                    empty.style.gridColumn = c;
                    grid.appendChild(empty);
                }
            }
        }
    }

    function buildCalendar() {
        const grid = document.getElementById('calendarGrid');
        for (let i = 1; i <= 20; i++) {
            const card = document.createElement('div');
            card.className = 'week-card';
            
            let status = 'status-study';
            let text = 'دراسة';

            holidays.forEach(h => {
                if (i >= h.start && i <= h.end) {
                    status = 'status-holiday';
                    text = h.name;
                }
            });

            card.innerHTML = `
                <div class="week-num">الأسبوع ${i}</div>
                <div class="week-dates">${weekDates[i]}</div>
                <div class="status-pill ${status}">${text}</div>
            `;
            grid.appendChild(card);
        }
    }

    // --- التشغيل ---
    window.addEventListener('DOMContentLoaded', () => {
        loadSettings();
        buildSchedule();
        buildCalendar();
    });

</script>
